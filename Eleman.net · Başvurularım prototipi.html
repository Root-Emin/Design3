.en-appbar--mobile.en-appbar--center{grid-template-columns:minmax(max-content,1fr) minmax(0,auto) minmax(max-content,1fr)}
.en-appbar__start,.en-appbar__end{display:flex;align-items:center;gap:var(--space-4);min-width:0}
.en-appbar--center .en-appbar__start{justify-self:start}
.en-appbar--center .en-appbar__end{justify-self:end}
.en-appbar--mobile .en-appbar__end{padding-right:var(--space-4)}
.en-appbar__center{display:flex;align-items:center;min-width:0}
.en-appbar--center .en-appbar__center{justify-content:center}
.en-appbar--center .en-appbar__title{text-align:center;padding:0}
.en-appbar__logo{display:inline-flex;align-items:center;min-height:var(--size-control-md);padding:0 var(--space-4);border-radius:var(--radius-sm);color:inherit;text-decoration:none;white-space:nowrap;font:var(--type-heading-3);font-weight:var(--font-weight-bold);letter-spacing:var(--type-heading-2-tracking)}

.en-appbar--brand .en-appbar__link,.en-appbar--brand .en-appbar__link.is-current{color:var(--_bar-fg)}

/* Prototip yerleşimi */
/* ---- Prototip yerleşimi: yalnızca token kullanır ---- */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
html,body{height:100%}
body{background:var(--bg-subtle);display:grid;place-items:center;overflow:hidden}
.stage{display:grid;place-items:center;width:100%;height:100%;padding:var(--space-24)}
.frame{position:relative;display:flex;flex-direction:column;width:390px;max-width:100%;height:844px;max-height:100%;overflow:hidden;border-radius:var(--radius-sheet);background:var(--bg-canvas);box-shadow:var(--elevation-4),0 0 0 var(--border-width-default) var(--border-default)}
@media (max-width:599px){.stage{padding:0}.frame{width:100%;height:100%;border-radius:0;box-shadow:none}}
.screen{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;background:var(--bg-canvas);overscroll-behavior:contain}
.screen:focus{outline:none}
#nav{flex:none}#nav .ds-bnav{max-width:none}
.ds-bnav__item{text-decoration:none}
.content{display:grid;gap:var(--space-16);padding:var(--space-16)}
.content>*{max-width:none}
.ds-app-card,.en-job,.en-pcm,.en-li,.en-track,.ds-alert,.en-card{max-width:none}
.ds-app-card{cursor:pointer}
.ds-app-card__titles{min-width:0;flex:1}
.ds-app-card__title,.en-job__title,.en-track__title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ds-app-card__head{min-width:0}
.sec-title{margin:0;font:var(--type-title);color:var(--text-primary)}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-8)}
.lead{margin:0;font:var(--type-body-medium);color:var(--text-secondary)}
.h2{margin:0;font:var(--type-heading-2);letter-spacing:var(--type-heading-2-tracking);color:var(--text-primary)}
.h3{margin:0;font:var(--type-heading-3);color:var(--text-primary)}
.meta{margin:0;font:var(--type-body-medium);color:var(--text-secondary)}
.stack-8{display:grid;gap:var(--space-8)}
.stack-12{display:grid;gap:var(--space-12)}
.row{display:flex;align-items:center;gap:var(--space-8);flex-wrap:wrap}
.chips{display:flex;gap:var(--space-8);overflow-x:auto;padding:var(--space-4) var(--space-16) var(--space-8);margin:0 calc(var(--space-16) * -1);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .en-chip{flex:none}
.list{display:grid;gap:var(--space-12)}
.tabs-wrap{position:sticky;top:var(--size-appbar-mobile);z-index:var(--z-sticky);background:var(--bg-surface)}
.en-tabs__panel{padding:0}
/* Liste kartı: ana metinler en az body-medium */
.ds-app-card__meta,.ds-app-card__next,.ds-app-card__company{font:var(--type-body-medium)}
/* Boş durum (DS'te bileşen yok: token + Button ile kuruldu) */
.empty{display:grid;justify-items:center;gap:var(--space-12);padding:var(--space-48) var(--space-24);text-align:center}
.empty__icon{display:grid;place-items:center;width:64px;height:64px;border-radius:var(--radius-full);background:var(--bg-subtle);color:var(--text-secondary)}
.empty__title{margin:0;font:var(--type-heading-3);color:var(--text-primary)}
.empty__text{margin:0;max-width:30ch;font:var(--type-body-medium);color:var(--text-secondary)}
/* Detay */
.job-head{display:flex;gap:var(--space-12);align-items:flex-start}
.job-head>div{min-width:0}
.panel{display:grid;gap:var(--space-12);padding:var(--inset-card);border-radius:var(--radius-card);background:var(--bg-surface);box-shadow:inset 0 0 0 var(--border-width-default) var(--border-default)}
.panel--flush{padding:var(--space-8) 0;overflow:hidden}
.panel--flush>.sec-title{padding:var(--space-8) var(--space-16) 0}
.panel .en-li{background:transparent}
.events .en-li__icon{color:var(--text-secondary)}
.events .en-li__sup{font:var(--type-caption);color:var(--text-tertiary)}
.events a.en-li{color:var(--text-primary)}
.actions{display:grid;gap:var(--space-8)}
.prose{margin:0;font:var(--type-body-medium);color:var(--text-secondary)}
.prose-list{margin:0;padding-left:var(--space-20);display:grid;gap:var(--space-4);font:var(--type-body-medium);color:var(--text-secondary)}
.bottom-bar{position:sticky;bottom:0;z-index:var(--z-sticky);display:flex;align-items:center;gap:var(--space-12);padding:var(--space-12) var(--space-16);background:var(--bg-surface);box-shadow:inset 0 var(--border-width-default) 0 var(--border-default)}
.bottom-bar>.ds-btn{flex:1}
.en-job__meta{list-style:none;margin:0;padding:0}
.en-job{cursor:pointer}
/* Başarı */
.done{display:grid;justify-items:center;gap:var(--space-12);padding:var(--space-48) var(--space-24) var(--space-24);text-align:center}
.done__icon{display:grid;place-items:center;width:72px;height:72px;border-radius:var(--radius-full);background:var(--feedback-success-bg);color:var(--feedback-success)}
.done .actions{width:100%;margin-top:var(--space-16)}
/* Mesaj */
.msg{display:grid;gap:var(--space-8);padding:var(--inset-card);border-radius:var(--radius-card);background:var(--bg-surface);box-shadow:inset 0 0 0 var(--border-width-default) var(--border-default)}
.msg p{margin:0;font:var(--type-body-medium);color:var(--text-primary)}
.msg .msg__meta{font:var(--type-caption);color:var(--text-tertiary)}
.msg--mine{background:var(--action-secondary);box-shadow:none;margin-left:var(--space-48)}
.composer{display:flex;align-items:flex-end;gap:var(--space-8);padding:var(--space-8) var(--space-16) var(--space-12);background:var(--bg-surface);box-shadow:inset 0 var(--border-width-default) 0 var(--border-default);position:sticky;bottom:0}
.composer .en-field{flex:1}
/* Katmanlar: sheet, dialog, snackbar telefon çerçevesinin içinde */
.layer{position:absolute;inset:0;z-index:var(--z-modal);display:none}
.layer.is-open{display:flex}
.layer .en-sheet-frame{position:absolute;inset:0;max-width:none;height:auto;border-radius:0;margin:0;animation:fade var(--duration-base) var(--easing-standard)}
.layer .en-sheet{max-height:100%;height:94%;animation:rise var(--duration-slow) var(--easing-decelerate)}
.layer .en-sheet--auto{height:auto;max-height:92%}
.layer .en-dialog-frame{position:absolute;inset:0;border-radius:0;min-height:0}
.snack-zone{position:absolute;left:var(--space-16);right:var(--space-16);bottom:calc(var(--size-bottomnav) + var(--space-12));z-index:var(--z-toast);display:flex;justify-content:center;pointer-events:none}
.snack-zone .en-snack{pointer-events:auto;animation:rise var(--duration-base) var(--easing-decelerate)}
.snack-zone.no-nav{bottom:var(--space-16)}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.layer .en-sheet,.layer .en-sheet-frame,.snack-zone .en-snack{animation:none}}
.form-group{display:grid;gap:var(--space-12)}
.form-group .en-sheet__label{margin:0}
.file-row{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-12);border-radius:var(--radius-control);box-shadow:inset 0 0 0 var(--border-width-default) var(--border-strong);color:var(--text-primary);font:var(--type-body-medium)}
.file-row .en-icon{color:var(--text-secondary);flex:none}
.file-row span{min-width:0;flex:1}
.file-row small{display:block;font:var(--type-caption);color:var(--text-tertiary)}
.en-field,.ds-field{width:100%;max-width:none}
/* Status Badge: DS'te Mülakat ve Teklif modifier'ı yok (DS boşluğu). Tracker'daki emsal token'lar kullanıldı. */
.ds-status--interview{--st:var(--ds-feedback-info);--st-subtle:var(--ds-feedback-info-subtle);--st-text:var(--ds-feedback-info-text)}
.ds-status--offer{--st:var(--ds-feedback-success);--st-subtle:var(--ds-feedback-success-subtle);--st-text:var(--ds-feedback-success-text)}
.ds-status__pop--interview{--st:var(--ds-feedback-info)}
.ds-status__pop--offer{--st:var(--ds-feedback-success)}
.ds-track__step--interview{--st:var(--ds-feedback-info);--st-subtle:var(--ds-feedback-info-subtle)}
.ds-track__step--offer{--st:var(--ds-feedback-success);--st-subtle:var(--ds-feedback-success-subtle)}
.ds-status__pop{max-width:100%}
/* Baseline: mevcut ekranın sade kopyası */
.bl-row{display:flex;align-items:center;gap:var(--space-12);padding:var(--space-12) var(--space-16);background:var(--bg-surface);box-shadow:inset 0 calc(var(--border-width-default) * -1) 0 var(--border-default);color:var(--text-primary);text-decoration:none}
.bl-row__text{flex:1;min-width:0}
.bl-row__title{display:block;margin:0;font:var(--type-body-medium);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bl-row__sub{margin:0;font:var(--type-caption);color:var(--text-tertiary);display:flex;align-items:center;gap:var(--space-4)}
.bl-row__icon{color:var(--text-tertiary);flex:none}
.bl-list{display:grid}
.bl-field{display:grid;gap:var(--space-4)}
/* Demo paneli (yalnız prototip) */
.demo{position:fixed;right:var(--space-16);bottom:calc(var(--space-16) + env(safe-area-inset-bottom,0px));z-index:var(--z-toast);display:grid;justify-items:end;gap:var(--space-8);max-width:calc(100% - var(--space-32))}
.demo__panel{width:320px;max-width:100%;max-height:min(70vh,640px);overflow:auto;display:grid;gap:var(--space-16);padding:var(--space-16);border-radius:var(--radius-card);background:var(--surface-raised);color:var(--text-primary);box-shadow:var(--elevation-4),inset 0 0 0 var(--border-width-default) var(--border-default)}
.demo__panel[hidden]{display:none}
.demo__group{display:grid;gap:var(--space-8)}
.demo__label{margin:0;font:var(--type-overline);letter-spacing:var(--type-overline-tracking);color:var(--text-secondary)}
.demo__chips{display:flex;flex-wrap:wrap;gap:var(--space-8)}
.demo__note{margin:0;font:var(--type-caption);color:var(--text-tertiary)}
.skip{position:absolute;left:-9999px}

.en-appbar__start:empty{width:var(--space-12)}
a.ds-btn{text-decoration:none}
.events .en-li__title{white-space:normal;overflow:visible;text-overflow:clip}

  var cls = "ds-btn ds-btn--" + (variant || "primary") + " ds-btn--" + (o.size || "md") + (o.block ? " ds-btn--block" : "") + (o.cls ? " " + o.cls : "");
  var inner = (o.icon && o.iconPos !== "end" ? ic(o.icon, 20) : "") + '<span class="ds-btn__label">' + esc(text) + "</span>" + (o.icon && o.iconPos === "end" ? ic(o.icon, 20) : "");
  if (o.href) return '<a class="' + cls + '" href="' + o.href + '" data-testid="' + o.tid + '">' + inner + "</a>";
  return '<button type="button" class="' + cls + '" data-act="' + (o.act || "") + '" data-arg="' + esc(o.arg || "") + '" data-testid="' + o.tid + '"' + (o.disabled ? " disabled" : "") + ">" + inner + "</button>";
}
function iconBtn(icon, labelText, o){
  o = o || {};
  var inner = ic(icon, 24);
  var cls = "en-iconbtn en-iconbtn--standard en-iconbtn--md en-state en-focus en-hit";
  if (o.href) return '<a class="' + cls + '" href="' + o.href + '" aria-label="' + esc(labelText) + '" data-testid="' + o.tid + '">' + inner + "</a>";
  return '<button type="button" class="' + cls + '" aria-label="' + esc(labelText) + '" data-act="' + (o.act||"") + '" data-arg="' + esc(o.arg||"") + '" data-testid="' + o.tid + '"' + (o.pressed != null ? ' aria-pressed="' + o.pressed + '"' : "") + ">" + inner + "</button>";
}
function appbar(title, o){
  o = o || {};
  var start = o.back ? '<div class="en-appbar__start"><span class="en-appbar__action">' + iconBtn("arrow-left", "Geri", {href: o.back, tid: "appbar-back"}) + "</span></div>" : '<div class="en-appbar__start"></div>';
  var center = o.logo
    ? '<div class="en-appbar__center"><a href="#' + S.ver + '-ana" class="en-appbar__logo en-focus" aria-label="eleman.net ana sayfa" data-testid="appbar-logo">eleman.net</a></div>'
    : '<div class="en-appbar__center"><h1 class="en-appbar__title" tabindex="-1" data-focus>' + esc(title) + "</h1></div>";
  var actions = '<div class="en-appbar__actions en-appbar__end">';
  (o.actions || []).forEach(function(a){ actions += '<span class="en-appbar__action">' + a + "</span>"; });
  if (o.bell !== false) {
    var n = unreadCount();
    actions += '<span class="en-appbar__action">' + iconBtn("bell", n ? "Bildirimler, " + n + " okunmamış" : "Bildirimler", {href:"#" + S.ver + "-bildirimler", tid:"appbar-bell"}) + (n ? '<span class="en-appbar__count en-num" aria-hidden="true">' + n + "</span>" : "") + "</span>";
  }
  actions += "</div>";
  return '<header class="en-appbar en-appbar--mobile en-appbar--start en-appbar--surface en-appbar--border-hairline">' + start + center + actions + "</header>";
}
function avatar(j, size){
  return '<span class="en-avatar en-avatar--' + (size || "md") + ' en-avatar--company en-avatar--' + j.tone + '" role="img" aria-label="' + esc(j.company) + '"><span>' + j.init + "</span></span>";
}
function statusBadge(a, o){
  o = o || {};
  var l = label(a), m = ST[l];
  var inner = '<span class="ds-sr">Başvuru durumu: </span>' + ic(m.icon, 16) + '<span class="ds-status__label">' + l + "</span>";
  if (!o.interactive) return '<span class="ds-status ' + m.mod + ' ds-status--subtle ds-status--' + (o.size || "md") + '" data-testid="status-badge">' + inner + "</span>";
  var id = "st-" + a.id;
  return '<span class="ds-status-wrap"><button type="button" class="ds-status ' + m.mod + ' ds-status--subtle ds-status--md ds-status--interactive" aria-expanded="' + S.popOpen + '" aria-controls="' + id + '" data-act="pop" data-testid="status-badge-help">' + inner +
    '<span class="ds-status__help">' + E.icon("help-circle", {size:14, cls:"ds-icon"}) + '<span class="ds-sr">, ne anlama geldiğini göster</span></span></button>' +
    '<span class="ds-status__pop ' + m.pop + '" id="' + id + '" role="note"' + (S.popOpen ? "" : " hidden") + '><span class="ds-status__pop-title">' + ic(m.icon, 16) + l + '</span><span class="ds-status__pop-text">' + m.what + '</span><span class="ds-status__pop-next"><strong>Sırada:</strong> ' + m.next + "</span></span></span>";
}
function compactTrack(a){
  var idx = STAGES.indexOf(a.stage), out = "";
  function step(cls, mod, icon, text, sr){
    return '<li class="ds-track__step ' + cls + " " + mod + '"' + (cls === "is-current" ? ' aria-current="step"' : "") + '><span class="ds-track__rail"><span class="ds-track__node">' + E.icon(icon, {size:14, cls:"ds-icon"}) + '</span><span class="ds-track__line"></span></span><span class="ds-track__body"><span class="ds-track__label"><span class="ds-sr">' + sr + "</span>" + text + "</span></span></li>";
  }
  if (idx > 0) { var p = STAGES[idx-1]; out += step("is-done", ST[p].track, "check", p, "Tamamlandı: "); }
  out += step("is-current", isClosed(a) ? "ds-track__step--closed" : ST[a.stage].track, isClosed(a) ? "minus-circle" : ST[a.stage].icon, isClosed(a) ? label(a) : a.stage, "Şu anki aşama: ");
  if (!isClosed(a) && idx < STAGES.length - 1) out += step("is-open", "", "more", idx === 0 ? "İşverenin incelemesi" : "Sonraki adım işverende", "Sonraki aşama: ");
  return '<div class="ds-app-card__track"><ol class="ds-track ds-track--horizontal ds-track--compact" aria-label="Başvuru ilerlemesi">' + out + "</ol></div>";
}
function appCard(a, o){
  o = o || {};
  var j = job(a.id), l = label(a);
  var nextLine = '<p class="ds-app-card__next">' + ic("info", 16) + "<span><strong>Sırada:</strong> " + ST[l].next + "</span></p>";
  var actions = "";
  if (a.outcome === "Sonuçlanmadı" || a.outcome === "Geri çekildi") {
    nextLine = '<p class="ds-app-card__next">' + ic("info", 16) + "<span>" + ST[l].next + "</span></p>";
    actions = '<div class="ds-app-card__actions">' + btn("Benzer ilanları gör", "tertiary", {size:"sm", href:"#" + S.ver + "-ara", tid:"card-similar-" + a.id}) + "</div>";
  }
  return '<article class="ds-app-card ds-app-card--' + (o.density || "comfortable") + (a.unread ? " is-unread" : "") + '" data-href="#v1-basvuru-' + a.id + '" data-testid="app-card-' + a.id + '">' +
    '<div class="ds-app-card__head">' + '<span class="ds-app-card__logo" aria-hidden="true">' + j.init + "</span>" +
    '<div class="ds-app-card__titles"><h3 class="ds-app-card__title"><a class="ds-app-card__link" href="#v1-basvuru-' + a.id + '" data-testid="app-card-link-' + a.id + '">' + esc(j.title) + '</a></h3><p class="ds-app-card__company">' + esc(j.company) + "</p></div>" +
    (a.unread ? '<span class="ds-app-card__new"><span class="ds-badge ds-badge--brand ds-badge--solid ds-badge--sm"><span>Yeni</span></span><span class="ds-sr"> durum güncellemesi</span></span>' : "") + "</div>" +
    '<p class="ds-app-card__meta"><span>' + ic("map-pin", 16) + esc(j.city) + "</span><span>" + ic("calendar", 16) + esc(a.ago) + "</span></p>" +
    '<div class="ds-app-card__status">' + statusBadge(a) + compactTrack(a) + "</div>" + nextLine + actions + "</article>";
}
function infoChip(icon, text){ return '<li><span class="en-chip en-chip--info">' + ic(icon, 16) + '<span class="en-chip__label">' + esc(text) + "</span></span></li>"; }
function matchInline(v){
  var lvl = v >= 80 ? ["high","Yüksek uyum"] : v >= 65 ? ["mid","İyi uyum"] : ["low","Kısmi uyum"];
  return '<span class="en-match en-match--inline en-match--' + lvl[0] + '" role="img" aria-label="%' + v + " uyum, " + lvl[1].toLowerCase() + '">' + ic("sparkle", 16) + '<span class="en-num">%' + v + '</span><span class="en-match__level">' + lvl[1] + "</span></span>";
}
function jobCard(jid){
  var j = job(jid), a = appForJob(jid);
  var cta = a ? statusBadge(a, {size:"sm"}) : btn("Başvur", "secondary", {size:"sm", href:"#" + S.ver + "-basvur-" + jid, tid:"job-apply-" + jid});
  return '<article class="en-job en-state" data-href="#' + S.ver + '-ilan-' + jid + '" data-testid="job-card-' + jid + '">' +
    '<div class="en-job__top">' + avatar(j, "lg") + '<div class="en-job__heading">' + (j.posted === "Bugün" ? '<div class="en-job__tags"><span class="en-badge en-badge--highlight en-badge--soft en-badge--label"><span>Yeni</span></span></div>' : "") +
    '<h3 class="en-job__title"><a href="#' + S.ver + "-ilan-" + jid + '" class="en-job__link" data-testid="job-link-' + jid + '">' + esc(j.title) + '</a></h3><p class="en-job__company">' + esc(j.company) + "</p></div>" +
    '<div class="en-job__save">' + iconBtn("bookmark", "İlanı kaydet", {act:"save", arg:jid, pressed:false, tid:"job-save-" + jid}) + "</div></div>" +
    '<ul class="en-job__meta" aria-label="İlan özellikleri">' + infoChip("map-pin", j.cityShort) + infoChip("building", j.mode) + infoChip("clock", j.type) + "</ul>" +
    '<p class="en-job__salary">' + ic("wallet", 16) + '<span class="en-num">' + tl(j.sal[0]) + " – " + tl(j.sal[1]) + '</span><span class="en-job__unit">/ ay net</span></p>' +
    '<div class="en-job__foot">' + matchInline(j.match) + '<span class="en-job__posted">' + j.posted + '</span><div class="en-job__cta">' + cta + "</div></div></article>";
}
function bnav(active){
  var items = [["ana","home","Ana sayfa"],["ara","search","İş ara"],["basvurularim","briefcase","Başvurularım"],["mesajlar","message","Mesajlar"],["profil","user","Profil"]];
  var n = unreadCount();
  return '<nav class="ds-bnav ds-bnav--translucent ds-bnav--bar ds-bnav--ind-pill ds-bnav--divider-hairline" aria-label="Ana gezinme">' + items.map(function(it){
    var badge = (it[0] === "basvurularim" && n) ? '<span class="ds-bnav__badge" aria-hidden="true">' + n + '</span><span class="ds-sr">, ' + n + " yeni durum güncellemesi</span>" : "";
    return '<a href="#' + S.ver + "-" + it[0] + '" class="ds-bnav__item"' + (active === it[0] ? ' aria-current="page"' : "") + ' data-testid="nav-' + it[0] + '"><span class="ds-bnav__icon">' + E.icon(it[1], {size:24, cls:"ds-icon"}) + badge + '</span><span class="ds-bnav__label">' + it[2] + "</span></a>";
  }).join("") + "</nav>";
}
function filterChip(text, selected, act, arg, tid, count){
  return '<button type="button" class="en-chip en-chip--filter en-state en-focus' + (selected ? " is-selected" : "") + '" aria-pressed="' + selected + '" data-act="' + act + '" data-arg="' + esc(arg) + '" data-testid="' + tid + '">' + (selected ? ic("check", 16) : "") + '<span class="en-chip__label">' + esc(text) + "</span>" + (count != null ? '<span class="en-chip__count en-num">' + count + "</span>" : "") + "</button>";
}
function alertBox(tone, title, msg, actionHtml){
  var icon = {info:"info", error:"alert-circle", success:"check-circle", warning:"alert-triangle"}[tone];
  return '<div class="ds-alert ds-alert--' + tone + ' ds-alert--inline" role="' + (tone === "error" || tone === "warning" ? "alert" : "status") + '"><span class="ds-alert__icon">' + ic(icon, 20) + '</span><div class="ds-alert__body"><p class="ds-alert__title">' + title + '</p><p class="ds-alert__msg">' + msg + "</p>" + (actionHtml ? '<div class="ds-alert__actions">' + actionHtml + "</div>" : "") + "</div></div>";
}
function li(o){
  var tag = o.href ? "a" : "div";
  return "<" + tag + (o.href ? ' href="' + o.href + '"' : "") + ' class="en-li en-li--divider' + (o.sup ? " en-li--two" : "") + (o.href ? " en-state en-focus" : "") + '"' + (o.tid ? ' data-testid="' + o.tid + '"' : "") + ">" +
    (o.avatar ? o.avatar : o.icon ? '<span class="en-li__icon">' + ic(o.icon, 24) + "</span>" : "") +
    '<span class="en-li__text"><span class="en-li__title">' + o.title + "</span>" + (o.sup ? '<span class="en-li__sup">' + o.sup + "</span>" : "") + "</span>" +
    (o.meta ? '<span class="en-li__meta en-num">' + o.meta + "</span>" : "") + (o.count ? '<span class="en-li__count en-num">' + o.count + "</span>" : "") +
    (o.href ? E.icon("chevron-right", {size:20, cls:"en-li__chev"}) : "") + "</" + tag + ">";
}
function emptyState(icon, title, text, actionHtml, tid){
  return '<section class="empty" data-testid="' + tid + '"><span class="empty__icon">' + ic(icon, 28) + '</span><h2 class="empty__title">' + title + '</h2><p class="empty__text">' + text + "</p>" + (actionHtml || "") + "</section>";
}

/* ---------- Ekranlar: v1 ---------- */
function scrApplications(){
  var html = appbar("Başvurularım");
  var open = S.apps.filter(function(a){ return !isClosed(a); }), closed = S.apps.filter(isClosed);
  html += '<div class="tabs-wrap"><div class="en-tabs en-tabs--underline en-tabs--full"><div class="en-tabs__list" role="tablist" aria-label="Başvuru listeleri">' +
    tab("devam", "Devam eden", open.length) + tab("sonuc", "Sonuçlanan", closed.length) + "</div></div></div>";
  function tab(id, text, n){ var on = S.tab === id; return '<button type="button" role="tab" id="t-' + id + '" aria-controls="p-tabs" aria-selected="' + on + '" tabindex="' + (on ? 0 : -1) + '" class="en-tabs__tab en-state en-focus' + (on ? " is-active" : "") + '" data-act="tab" data-arg="' + id + '" data-testid="tab-' + id + '"><span>' + text + '</span><span class="en-tabs__count en-num">' + n + "</span></button>"; }
  html += '<div class="content" role="tabpanel" id="p-tabs" aria-labelledby="t-' + S.tab + '">';
  if (S.listState === "yukleniyor") {
    html += '<div class="en-progress en-progress--progress en-progress--thin is-indeterminate"><div class="en-progress__head"><span id="pb-l">Başvuruların yükleniyor</span></div><div class="en-progress__track" role="progressbar" aria-labelledby="pb-l"><div class="en-progress__fill"></div></div></div>';
    html += '<div class="ds-skel" aria-hidden="true">' + [1,2,3].map(function(){ return '<div class="ds-skel__card"><div class="ds-skel__row"><span class="ds-skel__avatar is-sm"></span><span class="ds-skel__stack"><span class="ds-skel__line is-title" style="width:70%"></span><span class="ds-skel__line" style="width:45%"></span></span></div><span class="ds-skel__pill"></span><span class="ds-skel__line" style="width:85%"></span></div>'; }).join("") + "</div>";
    return html + "</div>";
  }
  if (S.listState === "hata") {
    html += alertBox("error", "Başvuruların yüklenemedi", "Bağlantını kontrol edip tekrar dene.", btn("Tekrar dene", "secondary", {size:"sm", icon:"loader", act:"retry", tid:"error-retry"}));
    return html + "</div>";
  }
  if (S.apps.length === 0) {
    html += emptyState("briefcase", "Henüz başvurun yok", "Başvurduğun ilanları ve işverenin hareketlerini burada takip edersin.", btn("İlanlara göz at", "primary", {href:"#v1-ara", tid:"empty-browse"}), "empty-applications");
    return html + "</div>";
  }
  var base = S.tab === "devam" ? open : closed;
  if (S.tab === "devam") {
    var opts = ["Tümü"].concat(STAGES);
    html += '<div class="chips" role="group" aria-label="Duruma göre filtrele">' + opts.map(function(o){
      var n = o === "Tümü" ? open.length : open.filter(function(a){ return a.stage === o; }).length;
      return filterChip(o, S.filter === o, "filter", o, "filter-" + (o === "Tümü" ? "tumu" : ST[o].key), n);
    }).join("") + "</div>";
    if (S.filter !== "Tümü") base = base.filter(function(a){ return a.stage === S.filter; });
  }
  if (!base.length) {
    if (S.tab === "devam") html += emptyState("filter", "Bu durumda başvurun yok.", "Diğer başvurularını görmek için filtreyi temizle.", btn("Filtreyi temizle", "tertiary", {act:"filter", arg:"Tümü", tid:"filter-clear"}), "empty-filter");
    else html += emptyState("check-circle", "Sonuçlanan başvurun yok.", "Sonuçlanan ve geri çektiğin başvurular burada görünür.", "", "empty-closed");
  } else {
    html += '<div class="list" data-testid="application-list">' + sorted(base).map(function(a){ return appCard(a); }).join("") + "</div>";
  }
  return html + "</div>";
}
function fullTrack(a){
  var idx = STAGES.indexOf(a.stage), closed = isClosed(a);
  var steps = STAGES.map(function(s, i){
    var cls, node = "", sr;
    if (i < idx || (i === idx && !closed && s === "Teklif")) { cls = "is-done"; node = ic("check", 14); sr = ", tamamlandı"; }
    else if (i === idx) { cls = closed ? "is-closed" : "is-current"; node = closed ? ic("minus", 14) : '<svg class="en-icon" aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>'; sr = closed ? ", süreç bu aşamada sonuçlandı" : ", mevcut aşama"; }
    else { cls = closed ? "is-skipped" : "is-todo"; sr = closed ? ", uygulanmadı" : ", bekliyor"; }
    return '<li class="en-track__step ' + cls + '"' + (cls === "is-current" ? ' aria-current="step"' : "") + '><span class="en-track__node">' + node + '</span><span class="en-track__label">' + s + '</span><span class="en-track__date en-num">' + (a.dates[s] || "—") + '</span><span class="en-sr">' + sr + "</span></li>";
  }).join("");
  var note = "";
  if (a.outcome === "Sonuçlanmadı") note = '<div class="en-track__note is-neutral"><p>' + ic("info", 16) + "<span>Bu pozisyon için süreç sonuçlandı. İşveren başka bir adayla ilerlemeye karar verdi.</span></p>" + btn("Benzer ilanları gör", "tertiary", {size:"sm", href:"#v1-ara", icon:"arrow-right", iconPos:"end", tid:"track-similar"}) + "</div>";
  if (a.outcome === "Geri çekildi") note = '<div class="en-track__note is-neutral"><p>' + ic("info", 16) + "<span>Bu başvuruyu sen geri çektin.</span></p></div>";
  if (a.stage === "Teklif" && !closed) note = '<p class="en-track__note is-success">' + ic("check-circle", 16) + "<span>Teklifin detayları Mesajlar'da.</span></p>";
  return '<section class="en-track en-track--vertical' + (closed ? " is-closed" : "") + '" aria-label="Başvuru aşamaları"><ol class="en-track__steps">' + steps + "</ol>" + note + "</section>";
}
function scrApplication(id){
  var a = app(id); if (!a) return scrNotFound();
  var j = job(a.id);
  var html = appbar("Başvuru detayı", {back:"#v1-basvurularim"});
  html += '<div class="content">';
  html += '<div class="job-head">' + avatar(j, "lg") + '<div class="stack-8"><h2 class="h3">' + esc(j.title) + '</h2><p class="meta">' + esc(j.company) + " · " + esc(j.city) + '</p><p class="meta">' + a.applied + " tarihinde başvurdun</p></div></div>";
  html += statusBadge(a, {interactive:true});
  html += '<div class="panel">' + fullTrack(a) + "</div>";
  html += '<section class="panel panel--flush events" aria-labelledby="ev-t"><h3 class="sec-title" id="ev-t">İşveren hareketleri</h3>' + a.events.map(function(e, i){
    var href = e.link ? "#v1-mesaj-" + e.link.split("-")[1] : null;
    return li({icon:e.icon, title:esc(e.text), sup:e.at, href:href, tid:"event-" + i});
  }).join("") + "</section>";
  var acts = "";
  if (a.stage === "Mülakat" && !isClosed(a)) acts += btn("Mülakat mesajını aç", "secondary", {block:true, href:"#v1-mesaj-1", icon:"message", tid:"detail-open-message"});
  if (a.stage === "Teklif" && !isClosed(a)) acts += btn("Teklif mesajını aç", "secondary", {block:true, href:"#v1-mesaj-2", icon:"message", tid:"detail-open-message"});
  acts += btn("İlanı görüntüle", "secondary", {block:true, href:"#v1-ilan-" + a.id, tid:"detail-view-job"});
  if (!isClosed(a) && a.stage !== "Teklif") acts += btn("Başvuruyu geri çek", "tertiary", {block:true, act:"withdraw", arg:a.id, tid:"detail-withdraw"});
  html += '<div class="actions">' + acts + "</div></div>";
  return html;
}
function salary(j){
  return '<div class="en-salary en-salary--full"><p class="en-salary__label">Maaş aralığı <span>(net, aylık)</span></p><p class="en-salary__value en-num">' + tl(j.sal[0]) + ' <span aria-hidden="true">–</span><span class="en-sr">ile</span> ' + tl(j.sal[1]) + "</p></div>";
}
function matchRing(v){
  var lvl = v >= 80 ? ["high","Yüksek uyum"] : v >= 65 ? ["mid","İyi uyum"] : ["low","Kısmi uyum"];
  var r = 29, c = 2 * Math.PI * r, off = c * (1 - v / 100);
  return '<div class="en-match en-match--ring en-match--md en-match--' + lvl[0] + '"><div class="en-match__ring" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + v + '" aria-valuetext="%' + v + " uyum, " + lvl[1].toLowerCase() + '" style="width:64px;height:64px">' +
    '<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle class="en-match__ring-track" cx="32" cy="32" r="29" stroke-width="6" fill="none"/><circle class="en-match__ring-fill" cx="32" cy="32" r="29" stroke-width="6" fill="none" stroke-linecap="round" stroke-dasharray="' + c.toFixed(2) + '" stroke-dashoffset="' + off.toFixed(2) + '" transform="rotate(-90 32 32)"/></svg>' +
    '<span class="en-match__value en-num">%' + v + '</span></div><div class="en-match__text"><span class="en-match__level">' + ic("sparkle", 16) + lvl[1] + "</span></div></div>";
}
function scrJob(jid){
  var j = job(jid); if (!j) return scrNotFound();
  var a = appForJob(jid), v = S.ver;
  var html = appbar("İlan detayı", {back: a ? "#" + v + "-basvuru-" + jid : "#" + v + "-ara", bell:false, actions:[iconBtn("bookmark", "İlanı kaydet", {act:"save", arg:jid, pressed:false, tid:"job-detail-save"})]});

  openLayer('<div class="en-sheet-frame" data-act="scrim"><section class="en-sheet en-sheet--auto" role="dialog" aria-modal="true" aria-labelledby="sh-f" data-testid="filter-sheet"><div class="en-sheet__handle" aria-hidden="true"></div><header class="en-sheet__head"><h2 class="en-sheet__title" id="sh-f">Filtrele</h2><button type="button" class="en-sheet__close en-state en-focus en-hit" aria-label="Kapat" data-act="close" data-testid="sheet-close">' + ic("close", 24) + "</button></header>" +
    '<div class="en-sheet__body">' + grp("Çalışma şekli", "mode", ["Ofiste","Hibrit","Uzaktan"]) + grp("Şehir", "city", ["İstanbul","Ankara","İzmir","Bursa","Eskişehir","Kocaeli","Antalya"]) + "</div>" +
    '<footer class="en-sheet__foot">' + btn("Temizle", "tertiary", {act:"sheetClear", tid:"filter-clear-all"}) + btn(n + " ilanı göster", "primary", {block:true, act:"close", tid:"filter-apply"}) + "</footer></section></div>");
}
function openWithdraw(id){
  var a = app(id), j = job(a.id);
  openLayer('<div class="en-dialog-frame has-scrim" data-act="scrim"><div class="en-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t" aria-describedby="dlg-d" data-testid="withdraw-dialog"><span class="en-dialog__icon is-destructive">' + ic("alert-triangle", 24) + '</span><h2 class="en-dialog__title" id="dlg-t">Başvuruyu geri çekmek istiyor musun?</h2>' +
    '<p class="en-dialog__body" id="dlg-d">' + esc(j.company) + " şirketindeki “" + esc(j.title) + "” başvurun geri çekilecek. [Tekrar başvuru kuralı].</p>" +
    '<div class="en-dialog__actions">' + btn("Vazgeç", "tertiary", {act:"close", tid:"dialog-cancel"}) + btn("Başvuruyu geri çek", "destructive", {act:"confirmWithdraw", arg:id, tid:"dialog-confirm"}) + "</div></div></div>");
  var c = layer.querySelector('[data-testid="dialog-cancel"]'); if (c) c.focus();
}
function toast(msg, tone, action){
  clearTimeout(snackTimer);
  var icon = {success:"check-circle", info:"info", error:"alert-circle"}[tone];
  snackZone.innerHTML = '<div class="en-snack en-snack--inline en-snack--' + (tone || "success") + '" role="status" aria-live="polite" data-testid="snackbar">' + (icon ? '<span class="en-snack__icon">' + ic(icon, 20) + "</span>" : "") + '<p class="en-snack__msg">' + msg + "</p>" +
    (action ? '<div class="en-snack__actions"><button type="button" class="en-snack__action en-state en-focus" data-act="' + action.act + '" data-arg="' + action.arg + '" data-testid="snackbar-action">' + action.label + "</button></div>" : "") + "</div>";
  snackTimer = setTimeout(function(){ snackZone.innerHTML = ""; }, 6000);
}

/* ---------- Router ---------- */
var screen, navSlot, current = "";
function parse(h){
  h = (h || "").replace(/^#/, "");
  var m = h.match(/^(v1|baseline)(?:-([a-z]+))?(?:-(\d+))?$/);
  if (!m) return {ver:"v1", r:"basvurularim", id:null};
  return {ver:m[1], r:m[2] || "basvurularim", id:m[3] ? +m[3] : null};
}
function render(keepScroll){
  var p = parse(location.hash), html;
  S.ver = p.ver;
  var prevScroll = screen.scrollTop;
  if (p.ver === "baseline") {
    if (p.r === "basvurularim") html = blApplications();
    else if (p.r === "basvuru") html = blApplication(p.id);
    else if (p.r === "ilan") html = scrJob(p.id);
    else if (p.r === "basvur") { html = scrJob(p.id); setTimeout(function(){ openApply(p.id); }); }
    else html = blApplications();
  } else {
    if (p.r === "basvuru" && app(p.id) && app(p.id).unread) app(p.id).unread = false;
    switch (p.r) {
      case "basvurularim": html = scrApplications(); break;
      case "basvuru": html = scrApplication(p.id); break;
      case "ilan": html = scrJob(p.id); break;
      case "basvur": html = scrJob(p.id); setTimeout(function(){ if (!appForJob(p.id)) openApply(p.id); }); break;
      case "basari": html = scrSuccess(p.id); break;
      case "ana": html = scrHome(); break;
      case "ara": html = scrSearch(); break;
      case "mesajlar": html = scrMessages(); break;
      case "mesaj": html = scrMessage(p.id); if (MSGS[p.id]) MSGS[p.id].unread = false; break;
      case "profil": html = scrProfile(); break;
      case "bildirimler": html = scrNotifications(); break;
      default: html = scrNotFound();
    }
  }
  screen.innerHTML = html;
  var nav = bnavFor(p.r);
  var hideNav = p.r === "basari" || p.r === "mesaj";
  navSlot.innerHTML = hideNav ? "" : bnav(nav);
  snackZone.classList.toggle("no-nav", hideNav);
  var key = location.hash;
  if (keepScroll) screen.scrollTop = prevScroll;
  else if (key !== current) { screen.scrollTop = 0; var f = screen.querySelector("[data-focus]") || screen.querySelector("h1, h2"); if (f && document.activeElement !== document.body) { if (!f.hasAttribute("tabindex")) f.setAttribute("tabindex", "-1"); f.focus({preventScroll:true}); } }
  current = key;
  syncDemo();
}

/* ---------- Etkileşimler ---------- */
function onClick(e){
  var t = e.target.closest("[data-act]");
  if (t && t.dataset.act) {
    var act = t.dataset.act, arg = t.dataset.arg;
    if (act === "scrim") { if (e.target === t) closeLayer(); return; }
    e.preventDefault();
    switch (act) {
      case "tab": S.tab = arg; S.filter = "Tümü"; render(true); screen.querySelector('[data-testid="tab-' + arg + '"]').focus(); break;
      case "filter": S.filter = arg; render(true); var c = screen.querySelector('[data-testid="filter-' + (arg === "Tümü" ? "tumu" : ST[arg].key) + '"]'); if (c) c.focus(); break;
      case "pop": S.popOpen = !S.popOpen; render(true); screen.querySelector('[data-testid="status-badge-help"]').focus(); break;
      case "retry": S.listState = "yukleniyor"; render(true); setTimeout(function(){ S.listState = "dolu"; render(true); }, 1400); break;
      case "withdraw": openWithdraw(+arg); break;
      case "confirmWithdraw":
        var a = app(arg); a._prev = {outcome:a.outcome, events:a.events.slice(), upd:a.upd};
        a.outcome = "Geri çekildi"; a.events.unshift(ev("minus-circle", "Başvurunu geri çektin", "27 Eki " + new Date().toTimeString().slice(0,5).replace(":", "."))); a.upd = 20261027.2358;
        closeLayer(); render(true); toast("Başvurun geri çekildi", "success", {act:"undoWithdraw", arg:arg, label:"Geri al"}); break;
      case "undoWithdraw":
        var b = app(arg); if (b && b._prev) { b.outcome = b._prev.outcome; b.events = b._prev.events; b.upd = b._prev.upd; delete b._prev; }
        snackZone.innerHTML = ""; render(true); toast("Başvurun geri alındı", "info"); break;
      case "openApply": openApply(+arg); break;
      case "addCover": var cb = layer.querySelector("#cover"); cb.checked = true; cb.focus(); break;
      case "submitApply": submitApply(arg, t); break;
      case "openFilter": openFilter(); break;
      case "sheetChip":
        var kv = arg.split("|"), arr = S.sheetFilters[kv[0]], i = arr.indexOf(kv[1]);
        if (i >= 0) arr.splice(i, 1); else arr.push(kv[1]);
        openFilter(); var again = layer.querySelector('[data-testid="sheet-' + kv[0] + "-" + kv[1] + '"]'); if (again) again.focus(); render(true); break;
      case "sheetClear": S.sheetFilters = {mode:[], city:[]}; openFilter(); render(true); break;
      case "clearSearch": S.q = ""; S.sheetFilters = {mode:[], city:[]}; render(true); break;
      case "close": closeLayer(); break;
      case "save":
        var pressed = t.getAttribute("aria-pressed") === "true";
        t.setAttribute("aria-pressed", String(!pressed)); t.innerHTML = ic(pressed ? "bookmark" : "bookmark-filled", 24);
        toast(pressed ? "İlan kayıtlardan çıkarıldı" : "İlan kaydedildi", "success"); break;
      case "sendMsg":
        var input = screen.querySelector("#reply"); var v = input.value.trim();
        if (!v) { toast("Göndermek için bir yanıt yaz.", "info"); input.focus(); return; }
        (S.messages[arg] = S.messages[arg] || []).push(v); render(true); toast("Yanıtın gönderildi", "success"); break;
      case "demo": demoAct(arg); break;
    }
    return;
  }
  var card = e.target.closest("[data-href]");
  if (card && !e.target.closest("a, button")) location.hash = card.dataset.href.replace("#v1", "#" + S.ver);
}
function onInput(e){
  if (e.target.id === "q") { S.q = e.target.value; var pos = e.target.selectionStart; render(true); var q = screen.querySelector("#q"); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.tagName === "SELECT") { var w = e.target.closest(".ds-field"); if (w) { w.classList.toggle("is-placeholder", !e.target.value); if (e.target.value) selError(e.target.id, false); } }
  if (e.target.id === "theme-tg") setTheme(e.target.checked ? "dark" : "light");
}
function onKey(e){
  if (e.key === "Escape" && layer.classList.contains("is-open")) { closeLayer(); return; }
  if (e.key === "Enter" && e.target.id === "reply") { var b = screen.querySelector('[data-testid="message-send"]'); if (b) b.click(); }
  var tabEl = e.target.closest && e.target.closest('[role="tab"]');
  if (tabEl && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { S.tab = S.tab === "devam" ? "sonuc" : "devam"; S.filter = "Tümü"; render(true); screen.querySelector('[data-testid="tab-' + S.tab + '"]').focus(); }
  if (e.key === "Tab" && layer.classList.contains("is-open")) {
    var fs = layer.querySelectorAll("button:not([disabled]), input, select, a[href]"); if (!fs.length) return;
    var first = fs[0], last = fs[fs.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
}

/* ---------- Tema ve demo paneli ---------- */
function setTheme(t){ document.documentElement.setAttribute("data-theme", t); try { localStorage.setItem("en-theme", t); } catch (e) {} syncDemo(); }
var demoState = "dolu";
function demoAct(arg){
  var kv = arg.split(":"), k = kv[0], v = kv[1];
  if (k === "ver") { location.hash = v === "baseline" ? "#baseline-basvurularim" : "#v1-basvurularim"; }
  if (k === "state") {
    demoState = v; S.dataset = "normal"; S.longTitle = false; S.tab = "devam"; S.filter = "Tümü";
    if (v === "dolu") { S.apps = baseApps(); S.listState = "dolu"; }
    if (v === "bos") { S.apps = []; S.listState = "dolu"; }
    if (v === "filtre") { S.apps = baseApps().filter(function(a){ return a.id === 1; }); S.listState = "dolu"; S.filter = "Değerlendirmede"; }
    if (v === "yukleniyor") { S.apps = baseApps(); S.listState = "yukleniyor"; }
    if (v === "hata") { S.apps = baseApps(); S.listState = "hata"; }
    if (v === "uzun") { S.apps = baseApps(); S.listState = "dolu"; S.longTitle = true; }
    if (v === "25") { S.apps = bigApps(); S.listState = "dolu"; }
    if (v === "tek") { S.apps = baseApps().filter(function(a){ return a.id === 1; }); S.listState = "dolu"; }
    var target = "#" + S.ver + "-basvurularim";
    if (location.hash !== target) location.hash = target; else render();
  }
  if (k === "theme") setTheme(v);
  if (k === "toggle") { var p = document.getElementById("demo-panel"); var open = p.hidden; p.hidden = !open; t2(open); }
  syncDemo();
}
function t2(open){ var b = document.querySelector('[data-testid="demo-toggle"]'); b.setAttribute("aria-expanded", String(open)); b.querySelector(".ds-btn__label").textContent = open ? "Demo panelini kapat" : "Demo paneli"; }
function syncDemo(){
  var p = document.getElementById("demo-panel"); if (!p) return;
  var theme = document.documentElement.getAttribute("data-theme");
  function grp(title, items){ return '<div class="demo__group"><p class="demo__label">' + title + '</p><div class="demo__chips">' + items.map(function(i){ return filterChip(i[0], i[2], "demo", i[1], "demo-" + i[1].replace(":", "-")); }).join("") + "</div></div>"; }
  p.innerHTML = '<h2 class="sec-title">Demo paneli</h2><p class="demo__note">Yalnız prototip içindir; ürünün parçası değildir.</p>' +
    grp("Versiyon", [["Yeni tasarım (v1)","ver:v1", S.ver === "v1"],["Mevcut ekran","ver:baseline", S.ver === "baseline"]]) +
    grp("Başvurularım durumu", [["Dolu liste","state:dolu", demoState === "dolu"],["Boş durum","state:bos", demoState === "bos"],["Filtre sonucu boş","state:filtre", demoState === "filtre"],["Yükleniyor","state:yukleniyor", demoState === "yukleniyor"],["Hata","state:hata", demoState === "hata"]]) +
    grp("Uç durumlar", [["Uzun pozisyon adı","state:uzun", demoState === "uzun"],["25 başvuru","state:25", demoState === "25"],["Tek başvuru","state:tek", demoState === "tek"]]) +
    grp("Tema", [["Açık","theme:light", theme !== "dark"],["Koyu","theme:dark", theme === "dark"]]);
}

/* ---------- Başlat ---------- */
document.addEventListener("DOMContentLoaded", function(){
  var t = null; try { t = localStorage.getItem("en-theme"); } catch (e) {}
  if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", t);
  screen = document.getElementById("screen"); navSlot = document.getElementById("nav"); layer = document.getElementById("layer"); snackZone = document.getElementById("snack");
  document.addEventListener("click", onClick);
  document.addEventListener("input", onInput);
  document.addEventListener("change", onInput);
  document.addEventListener("keydown", onKey);
  window.addEventListener("hashchange", function(){ closeLayer(); render(); });
  document.getElementById("demo").insertAdjacentHTML("afterbegin", '<div class="demo__panel" id="demo-panel" role="region" aria-label="Demo paneli" hidden></div>');
  document.getElementById("demo").insertAdjacentHTML("beforeend", btn("Demo paneli", "secondary", {size:"sm", icon:"settings", act:"demo", arg:"toggle", tid:"demo-toggle"}));
  document.querySelector('[data-testid="demo-toggle"]').setAttribute("aria-expanded", "false");
  document.querySelector('[data-testid="demo-toggle"]').setAttribute("aria-controls", "demo-panel");
  render();
});
})();

</script>
